name: Bootstrap

# One-time setup of the state bucket, OIDC provider and CI roles.
# First run: uses AWS_BOOTSTRAP_* secrets. Later runs: uses OIDC like everything else.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "bootstrap" to confirm
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-bootstrap
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_github_repository: ${{ github.repository }}
  STATE_BUCKET: gitops-platform-tfstate-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}

jobs:
  bootstrap:
    name: Apply bootstrap stack
    runs-on: ubuntu-latest
    environment: bootstrap
    if: inputs.confirm == 'bootstrap'
    defaults:
      run:
        working-directory: terraform/bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"

      - name: Configure AWS credentials (first run, static bootstrap key)
        if: env.BOOTSTRAP_KEY != ''
        env:
          BOOTSTRAP_KEY: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}

      - name: Configure AWS credentials (OIDC)
        if: env.BOOTSTRAP_KEY == ''
        env:
          BOOTSTRAP_KEY: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gitops-platform-gha-terraform-apply

      - name: Detect existing state bucket
        id: state
        run: |
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Init (remote state)
        if: steps.state.outputs.exists == 'true'
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Init (local state, first run)
        if: steps.state.outputs.exists == 'false'
        run: terraform init -backend=false

      - name: Apply
        run: terraform apply -auto-approve -no-color

      - name: Migrate local state into the new bucket
        if: steps.state.outputs.exists == 'false'
        run: |
          terraform init -migrate-state -force-copy \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          rm -f terraform.tfstate terraform.tfstate.backup

      - name: Summary
        run: |
          {
            echo "## Bootstrap outputs"
            echo '```'
            terraform output -no-color
            echo '```'
            echo
            echo "Delete the AWS_BOOTSTRAP_* repository secrets now; every later run uses OIDC."
          } >> "$GITHUB_STEP_SUMMARY"
