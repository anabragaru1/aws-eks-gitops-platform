name: Terraform plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/actions/terraform-init/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  lint:
    name: Lint and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"

      - name: Format check
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate every root and module
        run: |
          set -euo pipefail
          for dir in terraform/bootstrap terraform/environments/* terraform/modules/*; do
            # Modules that need an aliased provider are validated through the environment roots.
            if grep -q configuration_aliases "$dir"/versions.tf 2>/dev/null; then continue; fi
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        run: |
          set -euo pipefail
          tflint --init
          for dir in terraform/bootstrap terraform/environments/* terraform/modules/*; do
            echo "::group::$dir"
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format compact
            echo "::endgroup::"
          done

      - name: checkov
        uses: bridgecrewio/checkov-action@29be5868bfa968f099ae80169f61f42887494b8f # v12.3133.0
        with:
          config_file: .checkov.yaml
          output_format: cli

  plan:
    if: vars.AWS_ACCOUNT_ID != ''
    name: Plan ${{ matrix.environment }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    env:
      TF_VAR_github_app_id: ${{ vars.ARGOCD_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.ARGOCD_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.ARGOCD_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ matrix.environment }}
          role: plan
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt
          terraform show -no-color tfplan > plan-full.txt

      - name: Comment plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const path = `terraform/environments/${env}/plan.txt`;
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'no plan output';
            const limit = 60000;
            if (plan.length > limit) plan = plan.slice(-limit) + '\n... (truncated, see workflow log)';
            const marker = `<!-- terraform-plan-${env} -->`;
            const status = process.env.OUTCOME === 'success' ? 'succeeded' : 'FAILED';
            const body = `${marker}\n### Terraform plan: \`${env}\` (${status})\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
