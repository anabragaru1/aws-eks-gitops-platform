apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.charts.externalSecrets.repoURL }}
      chart: external-secrets
      targetRevision: {{ .Values.charts.externalSecrets.version | quote }}
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/kubernetes/platform/external-secrets/values.yaml
        valuesObject:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.roles.externalSecrets }}
    - repoURL: {{ .Values.source.repoURL }}
      targetRevision: {{ .Values.source.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  {{- include "root.syncPolicy" . | nindent 2 }}
---
# Store definitions go in a second app so the CRDs above exist before they are applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ .Values.source.repoURL }}
    targetRevision: {{ .Values.source.targetRevision }}
    path: kubernetes/platform/external-secrets/stores
    helm:
      valuesObject:
        region: {{ .Values.aws.region }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  {{- include "root.syncPolicy" . | nindent 2 }}
