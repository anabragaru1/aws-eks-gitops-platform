apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "api.name" . }}-db
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.database.secretStore }}
  target:
    name: {{ include "api.name" . }}-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.secretArn }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretArn }}
        property: password
