replicaCount: 2

serviceAccount:
  create: true
  name: aws-load-balancer-controller

enableServiceMutatorWebhook: false

podDisruptionBudget:
  maxUnavailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

defaultTags:
  ManagedBy: aws-load-balancer-controller
